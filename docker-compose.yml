version: "3.9"

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       apaar
      POSTGRES_USER:     apaar
      POSTGRES_PASSWORD: apaar_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaar"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:      postgresql+psycopg://apaar:apaar_secret@db:5432/apaar
      REDIS_URL:         redis://redis:6379/0
      SECRET_KEY:        "apaar-pramaan-dev-secret-change-in-production"
      ENVIRONMENT:       development
      APAAR_MOCK_URL:    http://apaar-mock:8001
      CORS_ORIGINS:      "http://localhost:5173,http://localhost:4173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Mock APAAR service ────────────────────────────────────────
  apaar-mock:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://apaar:apaar_secret@db:5432/apaar
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.adapters.apaar_mock_server:app --host 0.0.0.0 --port 8001 --reload

volumes:
  pgdata:
